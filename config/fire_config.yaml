# 实车验收前保持 false。
shoot_enable: false

# 弹丸和热量限制。
bullet_diameter_m: 0.017
min_bullet_speed_mps: 10.0
max_bullet_speed_mps: 35.0
heat_limit: 260.0

# 云台机械范围，单位 degree。
min_yaw_deg: -180.0
max_yaw_deg: 180.0
min_pitch_deg: -30.0
max_pitch_deg: 30.0

# yaw 距离分段。
yaw_distance_boundary_m: 2.0

# 目标距离 <= 2m。
near_max_yaw_command_jump_deg: 7.0
near_max_yaw_error_deg: 4.0

# 目标距离 > 2m。
far_max_yaw_command_jump_deg: 4.0
far_max_yaw_error_deg: 2.0

# pitch 暂时使用固定阈值，单位 degree。
max_aim_pitch_error_deg: 4.0
max_pitch_command_jump_deg: 7.0
max_pitch_error_deg: 4.0

# 数据最长有效时间，单位 ms。
max_robot_state_age_ms: 50
max_gimbal_pose_age_ms: 20
max_plan_age_ms: 30
