# 自瞄参数。缺省的键沿用代码里的默认值，所以这里只写需要调的项。
# 角度一律写**度**，加载时转成弧度；时间写毫秒，加载时转成秒。

inference:
  # openvino: CPU/GPU；tensorrt: CUDA，模型使用 .onnx/.engine/.plan。
  backend: "openvino"
  model_path: "model/armor_model/yolov5.xml"
  device: "CPU"

# L3 整车状态估计器的后端。
#   filter —— 整车 EKF（l3_estimation/filter_est/），默认，也是唯一经过回放验证的。
#   gtsam  —— GTSAM 因子图（l3_estimation/gtsam_est/），需要 xmake f --use_gtsam=y，
#             没编进来就选它的话，构造 Tracker 时会直接抛异常而不是回退到 filter。
estimator:
  backend: "filter"

# L3 单板 PnP 的几何。宽度是灯条中心间距，高度是灯条竖直跨度，单位米。
armor:
  small_width: 0.135
  big_width: 0.230
  height: 0.056
  # 装甲板安装倾角：普通车向后仰 15 度，前哨站的板向前倾。
  mount_pitch_deg: 15.0
  outpost_mount_pitch_deg: -15.0
  # yaw 搜索窗口以枪管朝向为中心，总宽 140 度。先按粗步长扫完整个窗口定盆地，
  # 再在盆地内 ±fine_range 按细步长扫。fine_range 不要小于 coarse_step，否则
  # 粗扫格点之间的空隙没人管。
  yaw_search_range_deg: 140.0
  yaw_coarse_step_deg: 3.0
  yaw_fine_range_deg: 3.0
  yaw_fine_step_deg: 0.1
  # yaw 代价：角点像素距离的 Huber + 相邻边夹角（度）的 Huber，后者按权重叠加。
  yaw_cost_huber_px: 5.0
  yaw_cost_huber_deg: 10.0
  yaw_cost_shape_weight: 0.3

# L3 跟踪状态机。计数单位是帧。
tracking:
  min_detect_count: 5
  max_frame_interval_ms: 100
  max_temp_lost_count: 15
  outpost_max_temp_lost_count: 75

# L3 两个后端共享的物理运动模型和半径边界。
target:
  accel_variance: 100.0
  yaw_accel_variance: 400.0
  outpost_accel_variance: 10.0
  outpost_yaw_accel_variance: 0.1
  # 各车型的初始旋转半径与物理范围，单位米。
  radius: 0.2
  outpost_radius: 0.2765
  base_radius: 0.3205
  min_radius: 0.05
  max_radius: 0.5

# EKF 后端专属参数。backend 不是 filter 时整段忽略。
filter:
  # 观测噪声基底：方位角/俯仰角、距离、装甲板 yaw，均为方差。
  angle_variance: 0.004
  distance_variance: 1.0
  armor_yaw_variance: 0.09
  min_update_count: 3
  outpost_min_update_count: 10
  max_nis_failure_ratio: 0.4
  outpost_v_yaw: 2.51

# GTSAM 因子图后端的参数。backend 不是 gtsam 时整段忽略。
# 噪声全部是**标准差 sigma**，不是 EKF filter 段使用的方差。
gtsam:
  # 观测与预测装甲板的关联门限。
  max_match_distance: 1.5
  max_match_yaw_diff_deg: 60.0
  first_update_batch_size: 1
  lost_threshold_ms: 300
  # 建图第一帧的先验 sigma。
  translation_prior_sigma: 0.1
  velocity_prior_sigma: 0.5
  yaw_prior_sigma: 9.0
  vyaw_prior_sigma: 9.0
  # 这个先验加在 logistic 的**原像**上，不是物理半径上。JLU 的 1e-4 换算成物理量是
  # 1e-4 * logisticDerivative(0.26, 0.15, 0.5) ≈ 7.5e-6 m，等于把半径焊死在
  # default_radius，力臂永远不自适应（回放里 r1 的 mean/p50/max 三个数全等于 0.26）。
  # 半径抖了整车中心就跟着抖，所以这里放开让径向残差自己去定它。
  radius_prior_sigma: 0.5
  dz_prior_sigma: 0.05
  # JLU robot_conf 的 logistic 半径与高度差参数；它们属于 GTSAM 后端，
  # 不复用上面 EKF target 段的 0.20/0.05。
  default_radius: 0.26
  radius_min: 0.15
  radius_max: 0.50
  default_dz: 0.0
  # JLU robot_conf 的运动因子 sigma。
  translation_factor_sigma: 0.01
  velocity_factor_sigma: 0.03
  yaw_factor_sigma: 0.01
  vyaw_factor_sigma: 0.2
  # 观测因子 sigma。切向/径向分开，半径只由径向项约束。
  #
  # 切向 JLU 原值是 0.005 m。对照 filter 段：同一个物理量那边是 angle_variance 0.004
  # （sigma 0.063 rad，3 m 处约 0.19 m 横向），两个后端差 38 倍。0.005 会让整车中心
  # 被单帧板位置硬拽着走。
  obs_tangential_sigma: 0.05
  obs_radial_sigma: 0.5
  obs_height_sigma: 0.01
  # obs_yaw_sigma 保持 JLU 的 0.001：这一项是"板螺丝拧死在车上"的刚性约束，不是测量
  # 噪声，测量噪声只从 obs_pixel_sigma 进来。单独放松它到 0.05 回放反而更差
  # （100 ms 开环中心误差 0.252 -> 0.298 m），别动。
  obs_yaw_sigma: 0.001
  # 重投影因子的像素 sigma。**图里板 yaw 的唯一测量噪声入口**，也是整车抖动的主因。
  #
  # JLU 原值 0.1 px 描述的是吉大的角点链路。本项目精修后的角点是 0.5~2 px 量级，而板的
  # roll/pitch 在图里是自由的（6 DOF 只有 4 个重投影残差 + 几何因子 4 维残差约束），
  # 0.1 px 会把本就病态的板 yaw 方向压死在单帧 IPPE 解上。回放实测 IPPE 原始板 yaw 的
  # 相邻帧跳变 mean 24 度，乘上 0.26 m 力臂正好是 0.26*sin(24 度) ≈ 0.106 m，与实测的
  # 整车中心帧间抖动 0.104 m 对得上。
  #
  # 20.0 是 records/3m_{high,mid,run_fast,run_mid} 上扫出来的经验值（0.1/1/5/20/50 单调
  # 改善并在 20~50 饱和），**不是**物理角点噪声——它的实际含义是"重投影因子当前的话语权
  # 要降两个数量级"。正解是照 docs/pnp_observation_noise_and_covariance.md 用
  # daedalus_noise_calib 把角点噪声实测出来再反推，届时这一行连同上面的切向/径向/高度
  # 一起重标。
  obs_pixel_sigma: 20.0

# L4 规划。延迟分段写毫秒。
planning:
  max_iterations: 15
  fly_time_tolerance_ms: 1.0
  # 转速超过 decision_speed(rad/s) 时用 high_speed 那一档延迟。
  high_speed_delay_ms: 30.0
  low_speed_delay_ms: 15.0
  decision_speed: 8.0
  yaw_offset_deg: 0.0
  pitch_offset_deg: 0.0
  fallback_bullet_speed: 23.0
  min_valid_bullet_speed: 14.0
  # 实车标定后再填这两段，填上之前 L5 不会解锁开火。
  # send_to_control_ms: 0.0
  # control_to_fire_ms: 0.0
  ballistic:
    gravity: 9.7833
    # 二次空气阻力系数，单位 1/m。0 表示真空模型；实车标定前保持 0。
    drag_coefficient: 0.0
    max_pitch_deg: 72.0
  selector:
    front_window_deg: 60.0
    outpost_coming_deg: 70.0
    outpost_leaving_deg: 30.0

# L5 火控。shoot_enable 是唯一的人为总闸，验收前保持 false。
fire:
  shoot_enable: false
  bullet_diameter: 0.017
  min_bullet_speed: 10.0
  max_bullet_speed: 32.0
  heat_limit: 200.0
  min_yaw_deg: -180.0
  max_yaw_deg: 180.0
  min_pitch_deg: -45.0
  max_pitch_deg: 45.0
  max_robot_state_age_ms: 50
  max_gimbal_pose_age_ms: 20
  armor_width_small: 0.135
  armor_width_big: 0.230
  # 能挨枪的板面高度，不是灯条跨度。
  armor_height: 0.125
  hit_margin_ratio: 0.6
  min_yaw_tolerance_deg: 0.5
  min_pitch_tolerance_deg: 0.5
