# 角度写度，时间按键名后缀写 ms / us，加载时换成弧度和秒；缺的键退回结构体默认值。
# 回放 A/B 的原始数据见 docs/replay_ab_log.md，判好坏一律用 track_diag 的 pred_px。
inference:
  # openvino / tensorrt（后者要 xmake f --use_tensorrt=y，目前是桩）。
  backend: "openvino"
  # 已验证：yolov5.xml、szu-v5n.xml -> yolov5_22，szu-v8n-fp16.onnx -> yolov8_21。
  # 这份 onnx 就是 Models-main 的 Infantry-v8n-fp16-20260726，那边的 IR 在 CPU 上
  # 输出逐位相同。换模型后要重跑 track_diag。
  model_path: "/home/rm/super/newvision/model/armor_model/szu-v8n-fp16.onnx"
  # CPU / GPU（Intel 核显，要装 intel-opencl-icd）。GPU 加载失败会告警并退回 CPU。
  # i9-13980HX + UHD 核显上整段 L2：CPU 12.9 ms、GPU 10.6 ms；GPU 按 FP16 算，角点差
  # 不到 0.2 px（网络输入尺度）。回放工具不读这一项，要对齐实机得加 -d=GPU。
  device: "GPU"

  # 模型期望的颜色顺序，必须是 rgb：写成 bgr 会红蓝对调，敌我过滤随之反向。
  model_color_order: "rgb"
  # 像素归一化的除数，255 即除到 [0, 1]。
  normalization_divisor: 255.0

  # 以下几项只影响调度、不改数值，只有 OpenVINO 的 CPU 插件认。
  # 自瞄要的是单帧延迟而不是吞吐，保持 true。
  latency_hint: true
  # 0 表示交给 OpenVINO 自决；少到 4 线程才明显变慢。
  num_threads: 8
  # any / pcore / ecore。
  scheduling_core_type: "pcore"
  # 不写表示保持 OpenVINO 默认；关掉通常和 pcore 一起用。
  # enable_hyper_threading: false

  decoder:
    # yolov5_22：[1, 25200, 22]；yolov8_21：[1, 21, 6300]，没有 objectness。
    # auto 按模型输出形状在两者里选（同上游部署库的 postprocess_mode=auto），
    # 形状对不上任何一种就启动报错，不会猜。
    layout: "auto"
    # 不写就用 layout 的预设（yolov5_22：0.7 / 0.8 / 0.3 / 0.7，
    # yolov8_21：0.5 / 0.5 / 0.2 / 0.5）。两种模型的置信度分布不同，别互相照抄；
    # auto 时写了的值对选中的哪种都生效。上游 JSON 的 score_threshold 就是
    # confidence_threshold，NMS IoU 上游写死 0.2。
    # confidence_threshold: 0.7
    # minimum_confidence: 0.8
    # nms_iou_threshold: 0.3
    # nms_score_threshold: 0.7

# 板 ROI 内的传统角点精修（SP-Vision）：传统灯条端点与网络角点的距离和小于
# max_endpoint_distance_px 才替换网络角点。用 armor_refiner_video_test 看替换比例。
# 回放结论：在现有八段 3 m 录像上精修是净负的，留着是因为 5 m 工况还没有录像。
refiner:
  enable: true
  # 场地偏暗调低、偏亮调高，取值在 (0, 255) 内。
  binary_threshold: 150.0
  # 灯条筛选：长度下限、与竖直方向的最大夹角、长宽比区间。
  min_lightbar_length_px: 8.0
  max_angle_error_deg: 45.0
  min_lightbar_ratio: 1.5
  max_lightbar_ratio: 20.0
  # 放大会让传统解无条件覆盖网络解，这个门限是在限制损害。
  max_endpoint_distance_px: 15.0
  # 端点用亮度梯度 + PCA 主轴定位，替代 minAreaRect 的二值边界。
  pca_corner_correction: false
  # 二值化底图用颜色差分而不是灰度：过曝时灰度切到的是饱和白核，长度随曝光变。
  color_channel_diff: true
  color_diff_threshold: 50.0

# 侧边灯条：跟踪中在 L3 给的 light_roi 里用传统二值化找灯条（FYT 做法），剔掉
# 属于已检出板的，剩下的交给 L3 按整车几何关联到邻板（门限见 ieskf.light_match_*）。
# 补的是整板网络漏检的侧面那块板。
light_finder:
  # 低曝光画面取 100~140，换曝光或场地后要重扫。
  binary_threshold: 140
  # 底图改用颜色差分（蓝 B−R、红 R−B），颜色未知时退回灰度。回放上 false 赢
  # 六段：过曝灯条差分后只剩两条细边，会被 min_ratio 毙掉。
  color_channel_diff: true
  color_diff_threshold: 50
  # 外接矩形 短边 / 长边，FYT 原值。
  min_ratio: 0.08
  max_ratio: 0.4
  # 偏离参考方向的最大角度：contour 相对图像竖直，profile 相对预测灯条方向。
  max_angle_deg: 40.0
  min_length_px: 4.0
  # 灯条中心落在检出板外接框外扩这么多倍灯长的范围内，就算那块板自己的灯条。
  armor_margin: 0.5
  # R/B 能量比大于它判红、小于它的倒数判蓝，中间判未知并丢弃。
  color_ratio_threshold: 1.10
  # contour：light_roi 内二值化找轮廓，上面几项门限都给它用。
  # profile：沿 L3 预测的每根灯条做垂直剖面找亮度脊线，不二值化、不看长宽比，
  #          只用 min_length_px / max_angle_deg / color_ratio_threshold 和下面几项。
  search: contour
  # 垂直灯条方向搜索半宽 = max(下限, 系数 × 预测灯长)，单位 px。
  profile_half_width_ratio: 0.5
  profile_half_width_min_px: 4.0
  # 沿灯条方向在预测端点外各多搜多少倍预测灯长（下限 2 px）。
  profile_extend_ratio: 0.5
  # 剖面 峰值 − 最小值 至少多少才算这一行有灯条，底图 0~255（见下一项）。
  profile_min_contrast: 40.0
  # 底图：目标通道与 G 都 >= 它的像素当过曝白核取 255，其余取 gain ×（目标 − 对方）。
  # G 是分开白核（249~255）和白色背景（3m_high 海报 229~240）的那个通道。
  profile_saturation: 245.0
  # 非饱和像素的差分乘它，让白核（255）比贴车身一侧的光晕（B−R 180~215）高一档。
  profile_diff_gain: 0.5
  # 端点定在行峰值降到中位对比度的多少倍处，[0.5, 1)。半高处端点被光晕往外拉。
  profile_end_level: 0.5
  # 各行脊线中心对拟合直线的 RMS 残差上限，px。
  profile_max_residual_px: 1.0

number_classifier:
  enable: false
  model_path: "model/light_model/mlp.onnx"
  label_path: "model/light_model/label.txt"
  # 不采信这块板时：drop 丢掉（sp_vision 的做法），keep 保留网络给的类别。
  # mlp.onnx 只认九类，遇到没见过的图案会一路判 negative，drop 会把整辆车筛掉。
  on_reject: "drop"
  # softmax 最大概率低于它就不采信。
  min_confidence: 0.7
  # 两灯条中心距 / 灯条长度 超过它按大板抠图。
  large_center_distance_ratio: 3.2

# 装甲板几何尺寸（米），PnP 物点和灯条端点观测共用。
armor:
  small_width_m: 0.135
  big_width_m: 0.230
  height_m: 0.056

# L3 整车估计器：迭代误差状态 EKF + 灯条端点像素观测。改噪声后必须重跑
# track_diag，不要凭感觉调。
ieskf:
  # 状态机按录像时间戳计时，不受回放倍速影响。
  tracking_thres: 5
  lost_time_thres: 1.5
  lost_time_thres_outpost: 2.0
  # 帧间隔超过它当作断流（相机重连、录像拼接），目标全部复位。
  max_frame_gap_ms: 100
  # 超过这么久没有成功更新，预测停止外推、停在原地。
  temp_lost_predict_ms: 100
  # 每帧更新的高斯牛顿迭代次数。
  iteration_num: 8

  # 车体系过程噪声，与 awakening test.yaml 对齐。
  body_acceleration: [30.0, 30.0, 1.0]
  yaw_acceleration: 30.0
  outpost_body_acceleration: [1.0, 1.0, 1.0]
  outpost_yaw_acceleration: 0.01
  radius_noise: 1.0e-7
  height_noise: 1.0e-7
  outpost_height_noise: 1.0e-7
  roll_pitch_noise: 0.1

  # 端点像素 sigma = max(sigma_min_px, 系数 × 灯条长度)，沿 / 垂直灯条分开给；
  # 当前是 rmcs 的常数 R = 40 px²。尺度已在平台区，NIS 不是优化目标，两端点
  # 相关不划算——都扫过了，别再推一遍。
  sigma_along_by_length: 0.0
  sigma_perp_by_length: 0.0
  sigma_min_px: 6.32
  # 侧边灯条只有几何关联、没有类别证据，sigma 再乘上它。
  isolated_light_sigma_scale: 1.4
  # 单块完整板时 IPPE 左右灯条深度差的 sigma（米）。
  armor_lights_depth_diff_sigma: 0.1

  # 侧边灯条关联，几道门都是硬拒绝：长度比、角度差（rad）、马氏距离（4 自由度，
  # 13.28 为 99% 分位），以及见过 0 号以外的板之后才启用。回放上帮了八段里的
  # 五段：动目标正收益，静止的 3m_mid / 3m_low 负收益。
  enable_lights_measure: false
  light_match_length_ratio_gate: 0.2
  light_match_angle_gate: 0.2
  light_match_chi2_gate: 13.28
  light_match_require_jumped: true

  # 装甲板关联代价的门限和权重；not_all_init 是还没见过 0 号以外的板时用的
  # 更宽门限。
  match_gate: 200.0
  match_gate_not_all_init: 1000.0
  weight_center_error: 5.0
  weight_angle_error: 10.0
  weight_side_length_error: 1.0

  # 初始半径先验（米）。
  initial_radius: 0.25
  initial_radius_outpost: 0.2765
  initial_radius_base: 0.3205

# L4 规划。
planning:
  # 飞行时间与命中位置互相迭代的次数上限和收敛门限（us）。
  max_iterations: 15
  fly_time_tolerance_us: 1000
  # v_yaw 超过 decision_speed_rad_s 用高速发射延迟，否则（含负向旋转）用低速的。
  high_speed_delay_ms: 30
  low_speed_delay_ms: 15
  decision_speed_rad_s: 8.0
  #########静止靶须调########
  # yaw / pitch 固定零偏。pitch 零偏在加上弹道仰角之后才按世界系约定取反。
  yaw_offset_deg: 0.0
  pitch_offset_deg: 0.0
  ##########################
  # 实测弹速低于 min_valid 时改用回退弹速，并把 Plan 降级为 TrackOnly、禁止开火。
  fallback_bullet_speed_mps: 23.0
  min_valid_bullet_speed_mps: 14.0
  # 选板的进入角 / 离开角；前哨转速固定、板面更窄，单独一组。
  coming_angle_deg: 60.0
  leaving_angle_deg: 20.0
  outpost_coming_angle_deg: 70.0
  outpost_leaving_angle_deg: 30.0

  # "串口发出 -> 电控执行"的延迟，只能在实车上标。不写 = 未标定：云台照常跟随，
  # 但 L5 以 delay_not_calibrated 拒绝开火。验收标完再取消注释。
  # send_to_control_ms: 5.0

# L5 开火闸门。
fire:
  # 发射总开关，验收前保持 false；关闭时仍计算 fire_feasible。
  shoot_enable: false
  # 只把板面中央这个比例视为可命中。
  hit_margin_ratio: 0.6
  # 由板尺寸和距离算出的 yaw / pitch 容差的下限。
  min_yaw_tolerance_deg: 0.5
  min_pitch_tolerance_deg: 0.5

# yaw 命令与上一帧相比跳得超过它时，本帧以 command_jump 拒绝开火，命令照发。
runtime:
  command_jump_deg: 10.0

# 调试叠加层。实机要关：imshow 要几毫秒并计进 image_to_plan，NUC 没显示器会直接抛。
# 蓝框 = L2 原始角点，绿 = 滤波器展开的整车，红框 = 选中的命中板。
debug:
  overlay: true
  # 每 N 帧画一次。
  overlay_every: 1
