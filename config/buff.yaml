# 能量机关（打符）独立配置，不读取装甲板模型参数。
detector:
  # model：网络找靶面/判状态，传统方法提取中心 R 和 PnP 十字端点。
  # traditional：完整旧版颜色/轮廓检测。修改后重启。
  method: "model"
  inference:
    model_path: "model/buff_model/buff.onnx"
    # 当前核显驱动编译失败，先使用 CPU；选 GPU 时失败会明确告警并回退 CPU。
    device: "CPU"
    # 按模型元数据 BR/BW/RR/RW 解码，BGR 相机图必须转 RGB。
    model_color_order: "rgb"
    confidence_threshold: 0.5
    nms_iou_threshold: 0.45
  min_distance_m: 1.7
  max_distance_m: 5.0
  #  - 检测距离：1.7～5.0 m
  max_perspective_deg: 60.0
  active_threshold: 0.2
  match_threshold: 0.5

tracker:
  noise_x: 0.00001
  noise_y: 0.00001
  noise_z: 0.00001
  noise_rotation_angle: 0.001
  noise_rotation_speed: 1.0
  noise_face_yaw: 0.00001
  noise_observation: 20.0
  gate_threshold: 13.816
  init_seed_mean_error: 10.0
  init_seed_max_error: 20.0
  init_center_gate: 30.0
  init_pitch_bound_deg: 20.0
  diverge_face_angle_deg: 45.0
  timeout_seconds: 1.5
  inactive_timeout_ms: 150

planning:
  # 优先使用电控 RobotState.bullet_speed；无效时仅用此值继续计算跟随角。
  fallback_bullet_speed_mps: 22.5
  # 低于该值或非有限值视为电控弹速无效。
  min_valid_bullet_speed_mps: 14.0
  # false 时回退弹速只能跟随、不能开火；实车建议保持 false。
  trust_fallback_bullet_speed: false
  shoot_delay_ms: 40
  yaw_offset_deg: 0.0
  pitch_offset_deg: 0.0
  idle_duration_ms: 400
  shoot_duration_ms: 200

control:
  # 忠实源 Rune FireController 的自动开火语义；调试跟随时可改为 false。
  shoot_enable: false

debug:
  overlay: true
  plot: false
