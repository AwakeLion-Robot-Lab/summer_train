# gamma: 0.5
# vid_pid: "f622:d13a" //需要更改

camera_name: "hikrobot"
exposure_ms: 20
gain: 10.0
# lsusb | grep 2bdf
vid_pid: "2bdf:0001"

# 视频和逐帧四元数记录；关闭时不会创建 records 文件。
recorder:
  #enabled: true
  enabled: false
  fps: 30.0
  output_dir: records

# 可选：把实际棋盘格/Charuco 标定结果直接写在这里。不要使用下列示例数值。
# calibration:
#   image_width: 1440
#   image_height: 1080
#   camera_matrix:
#     - [fx, 0.0, cx]
#     - [0.0, fy, cy]
#     - [0.0, 0.0, 1.0]
#   distortion_coefficients: [k1, k2, p1, p2, k3]
calibration:
  image_width: 1440
  image_height: 1080
  camera_matrix:
    - [1637.2846389992001, 0, 708.16615879526182]
    - [0, 1635.7446625406701, 560.71988764596608]
    - [0, 0, 1]
  distortion_coefficients: [-0.12708120858175301, 0.13500912916086708, -0.00052781395122133252, 0.00014277184772869901, 0]

  # 临时复用 tongjiceshi/configs/demo.yaml 的相机→枪管外参。
  # 只有相机安装位置和方向未改变时这些数值才具有物理意义。
  # 警告：下面是假参数
  T_barrel_camera:
    rotation:
      - [-0.0083195760046954614, 0.010498791137270739, 0.99991027599468041]
      - [-0.99960756138647755, -0.026835747568381807, -0.0080352891314148939]
      - [0.026748978935305992, -0.99958472279097077, 0.010717933047771133]
    translation: [0.094969301833534511, 0.095006290298006682, 0.050987066291756609]
